
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q *.zip -d source

      - name: Build APK
        run: |
          cd source/BapuDistanceMeter
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BapuDistanceMeter-APK
          path: source/BapuDistanceMeter/app/build/outputs/apk/debug/app-debug.apk
